# DEVELOPER-ONLY SOURCE BUILD (not used during customer installation).
# export WATCHDOG_VERSION="$(cat VERSION)"
# docker compose -f docker-compose.build.yaml build
# Official offline bundles and images are built by the tagged release workflow.

services:

  docker-container-watchdog:
    build:
      context: .
      args:
        WATCHDOG_VERSION: "$WATCHDOG_VERSION"
    image: watchdog:${WATCHDOG_VERSION:?Set WATCHDOG_VERSION from the VERSION file before building}
    container_name: docker-container-watchdog
    restart: always
    network_mode: host
    env_file: .env
    environment:
      WATCHDOG_CONFIG: /etc/watchdog/watchdog-config.yaml
      WATCHDOG_HOST:   ${WATCHDOG_HOST:-CyberController-Server}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./watchdog-config.yaml:/etc/watchdog/watchdog-config.yaml:ro
      - ./watchdog:/var/log/watchdog
    # ── Hardening ────────────────────────────────────────────────────────────
    # Defaults to root (0:0) for zero-config manual installs — the socket is
    # host-root-equivalent for any user anyway. install.sh instead populates
    # WATCHDOG_UID/WATCHDOG_GID/DOCKER_GID in .env to run this non-root.
    user: "${WATCHDOG_UID:-0}:${WATCHDOG_GID:-0}"
    group_add:
      - "${DOCKER_GID:-0}"
    read_only: true             # immutable root filesystem
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # ── Resource limits — contain a leak/runaway to this container, not the host ─
    mem_limit: 256m
    mem_reservation: 128m
    memswap_limit: 256m         # no swap beyond mem_limit — hits the limit and restarts instead of degrading the host
                                 # must stay >= mem_limit if you raise it, or Docker rejects this config
    mem_swappiness: 0           # avoid swapping this container's pages — needed when host kernel lacks swap accounting (memswap_limit is then unenforceable)
    cpus: "0.50"
    pids_limit: 200
    healthcheck:
      test: ["CMD", "python3", "-c", "import docker; docker.from_env().ping()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
