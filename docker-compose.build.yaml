# ── DEVELOPER / ONLINE BUILD ──────────────────────────────────────────────────
# Use this file when you have internet access and want to build a fresh image.
#
# Usage:
#   docker compose -f docker-compose.build.yaml build
#   docker compose -f docker-compose.build.yaml up -d
#
# After a successful build, export the image for offline customers:
#   docker save watchdog:latest -o watchdog.tar
# ─────────────────────────────────────────────────────────────────────────────

services:

  docker-container-watchdog:
    build:
      context: .
    image: watchdog:latest
    container_name: docker-container-watchdog
    restart: always
    network_mode: host
    env_file: .env
    environment:
      WATCHDOG_CONFIG: /etc/watchdog/watchdog-config.yaml
      WATCHDOG_HOST:   cyber-controller-server
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./watchdog-config.yaml:/etc/watchdog/watchdog-config.yaml:ro
      - ./watchdog:/var/log/watchdog
    # ── Hardening ────────────────────────────────────────────────────────────
    user: "1000:1000"          # non-root
    group_add:
      # host docker.sock group GID — auto-detected into .env by install.sh.
      # Required (no fallback): a wrong/guessed GID silently breaks socket access.
      - "${DOCKER_GID:?Set DOCKER_GID in .env to the docker.sock GID - run install.sh or see DEPLOYMENT.md}"
    read_only: true             # immutable root filesystem
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # ── Resource limits — contain a leak/runaway to this container, not the host ─
    mem_limit: 256m
    mem_reservation: 128m
    memswap_limit: 256m         # no swap beyond mem_limit — hits the limit and restarts instead of degrading the host
                                 # must stay >= mem_limit if you raise it, or Docker rejects this config
    mem_swappiness: 0           # avoid swapping this container's pages — needed when host kernel lacks swap accounting (memswap_limit is then unenforceable)
    cpus: "0.50"
    pids_limit: 200
    healthcheck:
      test: ["CMD", "python3", "-c", "import docker; docker.from_env().ping()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
