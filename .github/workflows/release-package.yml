name: Publish Container Alert release

# Publish only a reviewed, tagged commit already merged into main.
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify tag, version, and main ancestry
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          test "$GITHUB_REF_NAME" = "v$version"
          git fetch origin main:refs/remotes/origin/main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          echo "WATCHDOG_VERSION=$version" >> "$GITHUB_ENV"

      - name: Validate release scripts and Python tests
        shell: bash
        run: |
          set -euo pipefail
          bash -n install.sh uninstall.sh
          python3 -m pip install docker==7.1.0 requests==2.32.3 PyYAML==6.0.2
          python3 -m unittest discover -s tests -q

      - name: Build version-labelled release image
        shell: bash
        run: |
          set -euo pipefail
          docker build --build-arg "WATCHDOG_VERSION=$WATCHDOG_VERSION" \
            -t "watchdog:$WATCHDOG_VERSION" .
          image_version="$(docker image inspect "watchdog:$WATCHDOG_VERSION" \
            --format '{{index .Config.Labels "org.opencontainers.image.version"}}')"
          test "$image_version" = "$WATCHDOG_VERSION"
          docker run --rm --network none --entrypoint python3 \
            "watchdog:$WATCHDOG_VERSION" -c \
            "import docker, requests, yaml, pysnmp, cryptography, watchdog, lifecycle, ha_monitor"

      - name: Assemble and validate single customer package
        shell: bash
        run: |
          set -euo pipefail
          docker save "watchdog:$WATCHDOG_VERSION" -o watchdog.tar
          bash scripts/package_release.sh watchdog.tar dist
          (cd dist && sha256sum --check SHA256SUMS)
          package="dist/container-alert-v$WATCHDOG_VERSION.tar.gz"
          tar -tzf "$package" | grep -qx 'CyberController-Container-Alert/watchdog.tar'
          tar -tzf "$package" | grep -qx 'CyberController-Container-Alert/SHA256SUMS'
          tar -tzf "$package" | grep -qx 'CyberController-Container-Alert/install.sh'

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          notes=(--generate-notes)
          if [ -f "docs/customer/RELEASE_NOTES_V$WATCHDOG_VERSION.md" ]; then
            notes=(--notes-file "docs/customer/RELEASE_NOTES_V$WATCHDOG_VERSION.md")
          fi

          # Check both assets before making this public release visible.
          gh release create "$GITHUB_REF_NAME" \
            dist/SHA256SUMS "dist/container-alert-v$WATCHDOG_VERSION.tar.gz" \
            --verify-tag --draft --title "Container Alert $GITHUB_REF_NAME" \
            "${notes[@]}"

          expected=$(printf '%s\n' SHA256SUMS \
            "container-alert-v$WATCHDOG_VERSION.tar.gz" | sort)
          actual=$(gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name' | sort)
          test "$actual" = "$expected" || { echo "Release assets incomplete" >&2; exit 1; }
          gh release edit "$GITHUB_REF_NAME" --draft=false
