name: Publish Container Alert release

# Publish only a reviewed, tagged commit already merged into main.
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing release tag to publish (e.g. v1.6.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # The workflow on main can rebuild an original, existing release tag.
          ref: ${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.ref }}

      - name: Verify tag, version, and main ancestry
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          [[ "$RELEASE_TAG" =~ ^v[0-9]+[.][0-9]+[.][0-9]+$ ]]
          test "$RELEASE_TAG" = "v$version"
          git fetch origin main:refs/remotes/origin/main
          git merge-base --is-ancestor HEAD origin/main
          test "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" = "$(git rev-parse HEAD)"
          echo "WATCHDOG_VERSION=$version" >> "$GITHUB_ENV"

      - name: Validate release scripts and Python tests
        shell: bash
        run: |
          set -euo pipefail
          bash -n install.sh uninstall.sh
          python3 -m pip install docker==7.1.0 requests==2.32.3 PyYAML==6.0.2
          python3 -m unittest discover -s tests -q

      - name: Build version-labelled release image
        shell: bash
        run: |
          set -euo pipefail
          docker build --build-arg "WATCHDOG_VERSION=$WATCHDOG_VERSION" \
            -t "watchdog:$WATCHDOG_VERSION" .
          image_version="$(docker image inspect "watchdog:$WATCHDOG_VERSION" \
            --format '{{index .Config.Labels "org.opencontainers.image.version"}}')"
          test "$image_version" = "$WATCHDOG_VERSION"
          docker run --rm --network none --entrypoint python3 \
            "watchdog:$WATCHDOG_VERSION" -c \
            "import docker, requests, yaml, pysnmp, cryptography, watchdog, lifecycle, ha_monitor"

      - name: Assemble and validate single customer package
        shell: bash
        run: |
          set -euo pipefail
          docker save "watchdog:$WATCHDOG_VERSION" -o watchdog.tar
          bash scripts/package_release.sh watchdog.tar dist
          (cd dist && sha256sum --check SHA256SUMS)
          package="dist/container-alert-v$WATCHDOG_VERSION.tar.gz"
          tar -tzf "$package" > "$RUNNER_TEMP/package-contents.txt"

          grep -Fxq 'CyberController-Container-Alert/watchdog.tar' \
            "$RUNNER_TEMP/package-contents.txt"
          grep -Fxq 'CyberController-Container-Alert/SHA256SUMS' \
            "$RUNNER_TEMP/package-contents.txt"
          grep -Fxq 'CyberController-Container-Alert/install.sh' \
            "$RUNNER_TEMP/package-contents.txt"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          notes=(--generate-notes)
          if [ -f "docs/operations/RELEASE_NOTES_V$WATCHDOG_VERSION.md" ]; then
            notes=(--notes-file "docs/operations/RELEASE_NOTES_V$WATCHDOG_VERSION.md")
          fi

          # Check both assets before making this public release visible.
          gh release create "$RELEASE_TAG" \
            dist/SHA256SUMS "dist/container-alert-v$WATCHDOG_VERSION.tar.gz" \
            --verify-tag --draft --title "Container Alert $RELEASE_TAG" \
            "${notes[@]}"

          expected=$(printf '%s\n' SHA256SUMS \
            "container-alert-v$WATCHDOG_VERSION.tar.gz" | sort)
          actual=$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' | sort)
          test "$actual" = "$expected" || { echo "Release assets incomplete" >&2; exit 1; }
          gh release edit "$RELEASE_TAG" --draft=false
